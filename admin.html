<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin · Cătălin Drive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --s:#0f0d0a;--s2:#1e1b16;--s3:#2a241c;
  --amber:#f2b418;--amber-dk:#d99f0a;
  --bg:#f2f4f8;--card:#fff;
  --tx:#14120f;--tx2:#3b352c;--tx3:#6b6252;
  --border:rgba(20,18,15,.1);
  --danger:#e53e3e;--success:#38a169;--info:#3b82f6;
  --r:12px;--r-lg:18px;
  --sh:0 1px 3px rgba(20,18,15,.05),0 4px 16px rgba(20,18,15,.08);
  --ff:"Figtree",system-ui,sans-serif;
  --ffd:"Baloo 2",system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:var(--ff);font-size:15px;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}
input,select,textarea,button{font-family:inherit;font-size:inherit}
a{color:var(--amber)}

/* ── LOGIN ── */
#login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--s)}
.login-card{background:var(--card);border-radius:24px;padding:40px 48px;width:100%;max-width:420px;box-shadow:0 24px 64px rgba(0,0,0,.4)}
.login-logo{font-family:var(--ffd);font-weight:800;font-size:22px;color:var(--tx);margin-bottom:6px}
.login-sub{font-size:14px;color:var(--tx3);margin:0 0 32px}
.login-card label{display:block;font-size:13px;font-weight:600;color:var(--tx2);margin-bottom:6px}
.login-card input{width:100%;padding:12px 16px;border:1.5px solid var(--border);border-radius:var(--r);font-size:15px;outline:none;transition:border .15s}
.login-card input:focus{border-color:var(--amber)}
.login-card .btn-primary{margin-top:20px;width:100%}
#login-err{color:var(--danger);font-size:13px;margin-top:10px;display:none}
.login-hint{margin-top:20px;font-size:12px;color:var(--tx3);background:#fdf8ee;border-radius:8px;padding:10px 14px}
.login-hint b{color:var(--tx2)}

/* ── APP LAYOUT ── */
#app{display:none;min-height:100vh}
.app-layout{display:flex;min-height:100vh}
#sidebar{
  width:256px;flex-shrink:0;background:var(--s);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
}
@media(max-width:768px){
  .app-layout{flex-direction:column}
  #sidebar{width:100%;height:auto;position:static}
}
.sb-logo{padding:24px 20px 16px;border-bottom:1px solid rgba(255,255,255,.07)}
.sb-logo-name{font-family:var(--ffd);font-weight:800;font-size:17px;color:#f8f4ed}
.sb-logo-sub{font-size:11px;color:rgba(248,244,237,.4);letter-spacing:.1em;text-transform:uppercase}
.sb-section{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(248,244,237,.3);padding:20px 20px 6px}
.sb-nav{flex:1;padding:4px 12px}
.sb-btn{
  display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;
  background:none;border:0;cursor:pointer;
  font:inherit;font-size:14px;font-weight:500;color:rgba(248,244,237,.65);
  border-radius:10px;transition:background .15s,color .15s;text-align:left;
  margin-bottom:2px;
}
.sb-btn svg{opacity:.7;flex-shrink:0}
.sb-btn:hover{background:var(--s2);color:#f8f4ed}
.sb-btn:hover svg{opacity:1}
.sb-btn.active{background:rgba(242,180,24,.15);color:var(--amber);font-weight:600}
.sb-btn.active svg{opacity:1;color:var(--amber)}
.sb-footer{padding:16px 20px;border-top:1px solid rgba(255,255,255,.07)}
.sb-version{font-size:11px;color:rgba(248,244,237,.25);margin-bottom:10px}
.sb-logout{display:flex;align-items:center;gap:8px;background:none;border:0;cursor:pointer;font-size:13px;color:rgba(248,244,237,.45);padding:6px 0;transition:color .15s}
.sb-logout:hover{color:var(--danger)}

/* ── MAIN CONTENT ── */
#main-content{flex:1;overflow-y:auto}
.page-head{
  background:var(--card);border-bottom:1px solid var(--border);
  padding:18px clamp(16px,3vw,32px);
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  position:sticky;top:0;z-index:10;
}
.page-head-title{font-family:var(--ffd);font-weight:700;font-size:20px}
.page-head-sub{font-size:13px;color:var(--tx3);margin-top:2px}
.page-body{padding:clamp(16px,3vw,28px)}

/* ── BUTTONS ── */
.btn-primary{
  display:inline-flex;align-items:center;gap:7px;padding:10px 20px;
  background:var(--amber);color:var(--tx);font-weight:700;font-size:14px;
  border:none;border-radius:999px;cursor:pointer;white-space:nowrap;
  transition:background .15s,transform .1s,box-shadow .15s;
  box-shadow:0 4px 16px rgba(242,180,24,.32);
}
.btn-primary:hover{background:var(--amber-dk);transform:translateY(-1px);box-shadow:0 6px 20px rgba(242,180,24,.45)}
.btn-primary:active{transform:scale(.97)}
.btn-secondary{
  display:inline-flex;align-items:center;gap:7px;padding:10px 20px;
  background:transparent;color:var(--tx);font-weight:600;font-size:14px;
  border:1.5px solid var(--border);border-radius:999px;cursor:pointer;white-space:nowrap;
  transition:background .15s,border-color .15s;
}
.btn-secondary:hover{background:rgba(20,18,15,.05);border-color:rgba(20,18,15,.2)}
.btn-danger{
  display:inline-flex;align-items:center;gap:7px;padding:8px 16px;
  background:transparent;color:var(--danger);font-weight:600;font-size:13px;
  border:1.5px solid rgba(229,62,62,.3);border-radius:999px;cursor:pointer;
  transition:background .15s,border-color .15s;
}
.btn-danger:hover{background:rgba(229,62,62,.08);border-color:var(--danger)}
.btn-sm{padding:7px 14px;font-size:13px}
.btn-icon{
  width:34px;height:34px;border-radius:8px;border:0;cursor:pointer;
  display:grid;place-items:center;background:rgba(20,18,15,.06);
  color:var(--tx2);transition:background .15s,color .15s;
}
.btn-icon:hover{background:rgba(20,18,15,.12);color:var(--tx)}
.btn-icon.danger:hover{background:rgba(229,62,62,.1);color:var(--danger)}

/* ── CARDS ── */
.card{background:var(--card);border-radius:var(--r-lg);padding:24px;box-shadow:var(--sh);margin-bottom:16px}
.card-sm{padding:16px 20px}
.card-title{font-family:var(--ffd);font-weight:700;font-size:18px;margin:0 0 4px}
.card-sub{font-size:13px;color:var(--tx3);margin:0 0 18px}
.grid-2{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}

/* ── TABLE ── */
.tbl-wrap{overflow-x:auto;border-radius:var(--r-lg);background:var(--card);box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse;min-width:480px}
th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);padding:12px 16px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:14px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .12s}
tbody tr:hover{background:#fafafa}
.td-code{font-family:var(--ffd);font-weight:800;font-size:17px}
.td-name{font-size:12px;color:var(--tx3);margin-top:2px}
.td-price{font-family:var(--ffd);font-weight:800;font-size:18px}
.td-actions{display:flex;align-items:center;gap:6px}

/* ── FORMS ── */
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:600;color:var(--tx2);margin-bottom:6px}
.form-group input,.form-group select,.form-group textarea{
  width:100%;padding:10px 14px;border:1.5px solid var(--border);
  border-radius:10px;font-size:15px;outline:none;
  transition:border-color .15s,box-shadow .15s;background:#fff;color:var(--tx);
}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{
  border-color:var(--amber);box-shadow:0 0 0 3px rgba(242,180,24,.15);
}
.form-group textarea{resize:vertical;min-height:80px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:480px){.form-row{grid-template-columns:1fr}}
.form-hint{font-size:12px;color:var(--tx3);margin-top:5px}
.form-section{margin-bottom:24px;padding-bottom:24px;border-bottom:1px solid var(--border)}
.form-section:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.form-section-title{font-family:var(--ffd);font-weight:700;font-size:16px;margin:0 0 14px;color:var(--tx)}

/* ── CHECKBOXES ── */
.check-group{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.check-pill{
  display:flex;align-items:center;gap:7px;padding:7px 14px;
  border:1.5px solid var(--border);border-radius:999px;cursor:pointer;
  font-size:13px;font-weight:600;color:var(--tx2);transition:all .15s;
  user-select:none;
}
.check-pill input{display:none}
.check-pill:has(input:checked){background:rgba(242,180,24,.15);border-color:var(--amber);color:var(--tx)}
.check-pill:hover{border-color:var(--amber)}

/* ── MODAL ── */
#modal{position:fixed;inset:0;z-index:1000;display:none;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto}
#modal.open{display:flex}
.modal-overlay{position:fixed;inset:0;background:rgba(15,13,10,.6);backdrop-filter:blur(4px)}
.modal-box{
  position:relative;z-index:1;background:var(--card);
  border-radius:var(--r-lg);width:100%;max-width:580px;
  box-shadow:0 24px 64px rgba(0,0,0,.3);
  animation:modalIn .22s cubic-bezier(.16,1,.3,1) both;
  margin:auto;
}
@keyframes modalIn{from{opacity:0;transform:scale(.94) translateY(-12px)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border)}
.modal-title{font-family:var(--ffd);font-weight:700;font-size:18px}
.modal-close{background:none;border:0;cursor:pointer;color:var(--tx3);font-size:22px;line-height:1;padding:4px;border-radius:6px;transition:color .12s,background .12s}
.modal-close:hover{color:var(--tx);background:rgba(20,18,15,.07)}
.modal-body{padding:24px}
.modal-footer{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid var(--border);background:#fafafa;border-radius:0 0 var(--r-lg) var(--r-lg)}

/* ── TOASTS ── */
#toasts{position:fixed;bottom:24px;right:24px;z-index:2000;display:flex;flex-direction:column;gap:8px}
.toast{
  display:flex;align-items:center;gap:10px;
  padding:12px 18px;border-radius:12px;background:var(--tx);color:#f8f4ed;
  font-size:14px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.25);
  animation:toastIn .25s var(--ease,ease) both;min-width:240px;max-width:360px;
}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.toast.success{background:var(--success)}
.toast.danger{background:var(--danger)}
.toast.info{background:var(--info)}
.toast-icon{flex-shrink:0;font-size:16px}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
.badge-active{background:rgba(56,161,105,.15);color:#276749}
.badge-inactive{background:rgba(107,98,82,.1);color:var(--tx3)}
.badge-amber{background:rgba(242,180,24,.2);color:#7a5500}

/* ── STAT CARDS ── */
.stat-card{background:var(--card);border-radius:var(--r-lg);padding:20px 24px;box-shadow:var(--sh)}
.stat-n{font-family:var(--ffd);font-weight:800;font-size:36px;line-height:1;color:var(--amber);margin-bottom:4px}
.stat-lbl{font-size:13px;color:var(--tx3)}

/* ── INSTRUCTOR CARDS ── */
.instr-card{
  background:var(--card);border-radius:var(--r-lg);padding:20px;box-shadow:var(--sh);
  display:flex;flex-direction:column;gap:10px;
}
.instr-avatar{
  width:56px;height:56px;border-radius:16px;background:rgba(242,180,24,.18);
  display:grid;place-items:center;font-family:var(--ffd);font-weight:800;font-size:20px;color:var(--amber);
  flex-shrink:0;
}
.instr-name{font-family:var(--ffd);font-weight:700;font-size:17px}
.instr-role{font-size:13px;color:var(--tx3)}
.instr-cats{font-size:12px;font-weight:600;color:var(--tx2);background:#fdf1d3;padding:4px 12px;border-radius:999px;width:fit-content}
.instr-actions{display:flex;gap:8px;margin-top:auto}

/* ── OFFER CARDS ── */
.offer-card{
  background:var(--card);border-radius:var(--r-lg);padding:22px 24px;box-shadow:var(--sh);
  border-left:4px solid var(--amber);
  display:flex;flex-direction:column;gap:8px;
}
.offer-card.inactive{border-left-color:var(--border);opacity:.7}
.offer-name{font-family:var(--ffd);font-weight:700;font-size:17px}
.offer-tagline{font-size:13px;color:var(--tx3)}
.offer-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--tx3)}
.offer-actions{display:flex;gap:8px;margin-top:6px}
.offer-cats{display:flex;gap:6px;flex-wrap:wrap}
.offer-cat{background:rgba(242,180,24,.15);color:#7a5500;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px}

/* ── TOGGLE ── */
.toggle-wrap{display:flex;align-items:center;gap:10px}
.toggle{position:relative;width:44px;height:24px;cursor:pointer}
.toggle input{opacity:0;width:0;height:0}
.toggle-track{
  position:absolute;inset:0;background:#d1d5db;border-radius:999px;
  transition:background .2s;
}
.toggle input:checked + .toggle-track{background:var(--success)}
.toggle-thumb{
  position:absolute;left:2px;top:2px;width:20px;height:20px;
  background:#fff;border-radius:999px;box-shadow:0 1px 3px rgba(0,0,0,.2);
  transition:transform .2s;
}
.toggle input:checked ~ .toggle-thumb{transform:translateX(20px)}

/* ── QUICK NAMES ── */
.name-suggestions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.name-tag{
  font-size:12px;padding:5px 12px;border-radius:999px;
  background:#f2f4f8;border:1px solid var(--border);cursor:pointer;
  transition:background .12s,border-color .12s;white-space:nowrap;
}
.name-tag:hover{background:rgba(242,180,24,.15);border-color:var(--amber);color:var(--tx)}

/* ── ANNOUNCEMENT ── */
.anmt-preview{
  border-radius:12px;padding:14px 18px;font-size:15px;
  background:rgba(242,180,24,.12);border:1px solid rgba(242,180,24,.3);
  color:var(--tx2);
}
.anmt-preview.info{background:rgba(59,130,246,.1);border-color:rgba(59,130,246,.3)}
.anmt-preview.success{background:rgba(56,161,105,.1);border-color:rgba(56,161,105,.3)}
.anmt-preview.danger{background:rgba(229,62,62,.1);border-color:rgba(229,62,62,.3)}

/* ── MISC ── */
.empty-state{text-align:center;padding:48px 24px;color:var(--tx3)}
.empty-state svg{opacity:.3;margin-bottom:12px}
.empty-state h3{font-size:16px;color:var(--tx2);margin:0 0 6px}
.divider{border:0;border-top:1px solid var(--border);margin:20px 0}
.text-danger{color:var(--danger)}
.text-success{color:var(--success)}
.text-muted{color:var(--tx3)}

/* ── PUBLISH BUTTON ── */
.pub-btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:9px 20px;background:var(--amber);color:var(--dark);
  font-family:var(--ff);font-weight:700;font-size:13px;
  border:none;border-radius:999px;cursor:pointer;
  transition:all .2s;box-shadow:0 4px 16px rgba(242,180,24,.32);
  white-space:nowrap;flex-shrink:0;
}
.pub-btn:hover{background:var(--amber-dk);transform:translateY(-1px)}
.pub-btn:disabled{opacity:.65;cursor:not-allowed;transform:none}
.pub-btn.pending{animation:pubPulse 1.4s ease-in-out infinite}
.pub-btn.ok{background:var(--success);color:#fff}
.pub-btn.err{background:var(--danger);color:#fff}
@keyframes pubPulse{
  0%,100%{box-shadow:0 4px 16px rgba(242,180,24,.32)}
  50%    {box-shadow:0 4px 28px rgba(242,180,24,.72)}
}
#pub-status{font-size:11px;color:var(--tx3);text-align:right;max-width:180px;line-height:1.3}
</style>
</head>
<body>

<!-- ═══ LOGIN ═══════════════════════════════════════════════════ -->
<div id="login-wrap">
  <div class="login-card">
    <div class="login-logo">Cătălin Drive</div>
    <p class="login-sub">Panou de administrare</p>
    <form onsubmit="tryLogin(event)">
      <div class="form-group">
        <label>Parolă</label>
        <input type="password" id="pw-input" placeholder="Introdu parola" autocomplete="current-password">
      </div>
      <div id="login-err">Parolă incorectă. Încearcă din nou.</div>
      <button type="submit" class="btn-primary">Intră în panou</button>
    </form>
    <div class="login-hint">Parola implicită: <b>catalindrive2026</b><br>Schimb-o din <b>Setări → Securitate</b>.</div>
  </div>
</div>

<!-- ═══ APP ══════════════════════════════════════════════════════ -->
<div id="app">
  <div class="app-layout">

    <!-- SIDEBAR -->
    <aside id="sidebar">
      <div class="sb-logo">
        <div class="sb-logo-name">Cătălin Drive</div>
        <div class="sb-logo-sub">Admin Panel</div>
      </div>
      <div class="sb-nav">
        <div class="sb-section">General</div>
        <button class="sb-btn active" data-page="dashboard" onclick="navigate('dashboard')">
          <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          Dashboard
        </button>
        <button class="sb-btn" data-page="prices" onclick="navigate('prices')">
          <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
          Prețuri
        </button>
        <button class="sb-btn" data-page="offers" onclick="navigate('offers')">
          <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
          Oferte & Promoții
        </button>
        <div class="sb-section">Conținut</div>
        <button class="sb-btn" data-page="instructors" onclick="navigate('instructors')">
          <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
          Instructori
        </button>
        <button class="sb-btn" data-page="testimonials" onclick="navigate('testimonials')">
          <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
          Recenzii
        </button>
        <button class="sb-btn" data-page="announcement" onclick="navigate('announcement')">
          <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 17H2a3 3 0 000 6h20a3 3 0 000-6zM5 17V5a2 2 0 012-2h10a2 2 0 012 2v12"/><path d="M12 17v4"/></svg>
          Anunțuri
        </button>

═══════════════════════════════════════════════════════ */
function fmt(n) {
  return Number(n).toLocaleString('ro-RO') + ' lei';
}
function escH(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function genId() { return Date.now() + Math.floor(Math.random()*1000); }
function fmtDate(d) {
  if(!d) return '—';
  const [y,m,dd] = d.split('-');
  return `${dd}.${m}.${y}`;
}
function isActive(offer) {
  if(!offer.active) return false;
  const now = new Date(); now.setHours(0,0,0,0);
  const s = offer.startDate ? new Date(offer.startDate) : null;
  const e = offer.endDate   ? new Date(offer.endDate)   : null;
  if(s && now < s) return false;
  if(e && now > e) return false;
  return true;
}
function applyDiscount(price, offer) {
  if(!offer) return price;
  if(offer.discountType === 'percent') return Math.round(price * (1 - offer.discountValue/100));
  return Math.max(0, price - offer.discountValue);
}
function discountLabel(offer) {
  if(offer.discountType === 'percent') return `-${offer.discountValue}%`;
  return `-${offer.discountValue} lei`;
}
const ALL_CATS = ['B','A','C','CE','D','BE','Tr'];

/* ═══════════════════════════════════════════════════════
   TOAST
═══════════════════════════════════════════════════════ */
function toast(msg, type='success') {
  const icons = {success:'✓', danger:'✕', info:'ℹ'};
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span class="toast-icon">${icons[type]||'✓'}</span><span>${escH(msg)}</span>`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

const GH_REPO = 'TheTechology/scoalaauto';

function _hasPublishMethod() {
  return !!(localStorage.getItem('catalindrive_gh_token') ||
            localStorage.getItem('catalindrive_netlify_hook'));
}

function updatePubBtn() {
  const btn = document.getElementById('pub-btn');
  const st  = document.getElementById('pub-status');
  if (!btn || !st) return;
  const pending = localStorage.getItem('catalindrive_pending') === '1';
  if (pending) {
    btn.className = 'pub-btn pending';
    if (!_hasPublishMethod()) {
      st.textContent = 'Configurează publicarea în Setări';
      st.style.color = 'var(--danger)';
    } else {
      st.textContent = 'Modificări nesincronizate';
      st.style.color = '#c4551f';
    }
  } else {
    btn.className = 'pub-btn';
    st.textContent = 'Site sincronizat ✓';
    st.style.color = 'var(--success)';
  }
}

async function publishSite() {
  const ghToken   = localStorage.getItem('catalindrive_gh_token');
  const netlifyHk = localStorage.getItem('catalindrive_netlify_hook');

  if (!ghToken && !netlifyHk) {
    toast('Configurează cel puțin o metodă de publicare în Setări.', 'danger');
    navigate('settings');
    return;
  }

  const btn = document.getElementById('pub-btn');
  const st  = document.getElementById('pub-status');
  btn.innerHTML = '<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg> Se publică...';
  btn.disabled  = true;
  btn.className = 'pub-btn';

  const results = [];

  /* ── 1. GitHub: actualizează data.json ── */
  if (ghToken) {
    st.textContent = 'Scriere data.json pe GitHub...';
    st.style.color = 'var(--tx3)';
    try {
      const data = DB.load();
      let encoded;
      try { encoded = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2)))); }
      catch(e) { encoded = btoa(JSON.stringify(data, null, 2)); }

      const hdrs = {
        'Authorization': 'token ' + ghToken,
        'Accept':        'application/vnd.github.v3+json',
        'Content-Type':  'application/json'
      };
      let sha;
      const r0 = await fetch('https://api.github.com/repos/' + GH_REPO + '/contents/' + GH_FILE, { headers: hdrs });
      if (r0.ok) { sha = (await r0.json()).sha; }

      const body = { message: 'Admin: actualizare · ' + new Date().toLocaleString('ro-RO'), content: encoded, branch: 'main' };
      if (sha) body.sha = sha;

      const r1 = await fetch('https://api.github.com/repos/' + GH_REPO + '/contents/' + GH_FILE,
        { method: 'PUT', headers: hdrs, body: JSON.stringify(body) });

      if (r1.ok) { results.push('GitHub ✓'); }
      else {
        const e = await r1.json().catch(() => ({}));
        results.push('GitHub ✕ ' + (e.message || r1.status));
      }
    } catch(e) { results.push('GitHub ✕ ' + e.message); }
  }

  /* ── 2. Netlify Deploy Hook: declanșează redeploy ── */
  if (netlifyHk) {
    st.textContent = 'Declanșare redeploy Netlify...';
    st.style.color = 'var(--tx3)';
    try {
      const r2 = await fetch(netlifyHk, { method: 'POST' });
      if (r2.ok || r2.status === 200 || r2.status === 204) { results.push('Netlify ✓'); }
      else { results.push('Netlify ✕ HTTP ' + r2.status); }
    } catch(e) { results.push('Netlify ✕ ' + e.message); }
  }

  /* ── Rezultat final ── */
  const ok = results.every(r => r.includes('✓'));
  btn.disabled = false;
  if (ok) {
    localStorage.removeItem('catalindrive_pending');
    btn.innerHTML  = '✓ Publicat!';
    btn.className  = 'pub-btn ok';
    st.textContent = results.join(' · ') + ' · ~1 min';
    st.style.color = 'var(--success)';
    toast('Publicat cu succes! ' + results.join(', ') + '. Site-ul se actualizează în ~1 minut.', 'success');
    setTimeout(() => { btn.innerHTML = PUB_ICON; updatePubBtn(); }, 6000);
  } else {
    btn.innerHTML  = '✕ Eroare';
    btn.className  = 'pub-btn err';
    st.textContent = results.join(' · ');
    st.style.color = 'var(--danger)';
    toast('Eroare la publicare: ' + results.join(', '), 'danger');
    setTimeout(() => { btn.innerHTML = PUB_ICON; updatePubBtn(); }, 6000);
  }
}

function saveGHToken() {
  const t = (document.getElementById('gh-token').value || '').trim();
  if (t) { localStorage.setItem('catalindrive_gh_token', t); toast('Token GitHub salvat.', 'success'); }
  else   { localStorage.removeItem('catalindrive_gh_token'); toast('Token GitHub șters.', 'info'); }
  updatePubBtn();
}

function saveNetlifyHook() {
  const h = (document.getElementById('netlify-hook').value || '').trim();
  if (h) { localStorage.setItem('catalindrive_netlify_hook', h); toast('Netlify hook salvat.', 'success'); }
  else   { localStorage.removeItem('catalindrive_netlify_hook'); toast('Netlify hook șters.', 'info'); }
  updatePubBtn();
}

/* ═══════════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════════ */
if(localStorage.getItem(LS_AUTH) === '1') { navigate('dashboard'); updatePubBtn(); }
</script>
